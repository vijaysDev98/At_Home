buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.google.gms:google-services:4.4.4")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.7")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Gradle 9 + AGP treat typedefs.txt as a required input of sync*LibJars.
// Many RN libraries (e.g. @react-native-picker/picker) have no typedef
// annotations, so extract*Annotations never writes that file and the
// release build fails. Create an empty placeholder when it is missing.
def ensureTypedefRecipeFile = { project ->
    if (!project.plugins.hasPlugin("com.android.library")) {
        return
    }
    project.android.libraryVariants.all { variant ->
        def cap = variant.name.capitalize()
        def typedefFile = new File(
            project.buildDir,
            "intermediates/annotations_typedef_file/${variant.name}/extract${cap}Annotations/typedefs.txt"
        )
        if (!typedefFile.exists()) {
            typedefFile.parentFile.mkdirs()
            typedefFile.createNewFile()
        }
    }
}

subprojects { subproject ->
    if (subproject.state.executed) {
        ensureTypedefRecipeFile(subproject)
    } else {
        subproject.afterEvaluate { ensureTypedefRecipeFile(subproject) }
    }
}

gradle.taskGraph.whenReady { graph ->
    graph.allTasks.each { task ->
        if (task.name ==~ /sync.*LibJars/ && task.hasProperty("typedefRecipe")) {
            try {
                def recipe = task.property("typedefRecipe")
                if (recipe != null && recipe.present) {
                    def file = recipe.get().asFile
                    if (!file.exists()) {
                        file.parentFile.mkdirs()
                        file.createNewFile()
                    }
                }
            } catch (Throwable ignored) {
            }
        }
    }
}
